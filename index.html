<!DOCTYPE html>
<html lang="en" style="background-color: #0A0A0F;">
  <head>
    <script>
      // Runs before anything else paints — sets the correct theme class immediately, so there's
      // no flash of the wrong mode while React boots up. Defaults to dark unless the person has
      // explicitly chosen light before.
      (function () {
        var saved = localStorage.getItem('athlonix-theme');
        var theme = saved === 'light' ? 'light' : 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#0A0A0F' : '#FFFFFF';
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athlenix — Every Season Has a Turning Point</title>
    <meta name="description" content="Athlenix turns athlete movement into executive decisions for elite sports organizations." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/balls/soccer.png" />
    <link rel="preload" as="image" href="/balls/tennis.png" />
    <link rel="preload" as="image" href="/balls/basketball.png" />
    <link rel="preload" as="image" href="/balls/volleyball.png" />
    <link rel="preload" as="image" href="/balls/baseball.png" />
  </head>
  <body style="background-color: #0A0A0F;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
